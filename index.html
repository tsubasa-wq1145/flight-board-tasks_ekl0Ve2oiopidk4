<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEPARTURE — Task Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DSEG14+Classic:wght@400;700&family=Oswald:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --board-bg: #0a0a0c;
    --board-panel: #131318;
    --board-frame: #2a2a30;
    --flap: #1a1a1f;
    --flap-edge: #000;
    --amber: #f5b942;
    --amber-dim: #b8862a;
    --white: #e8e8e4;
    --green: #4caf7d;
    --red: #e05a52;
    --row-alt: #16161b;
    --metal: #34343a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Oswald', sans-serif;
    background:
      radial-gradient(ellipse at top, #1c1c22 0%, #050507 70%);
    color: var(--white);
    min-height: 100vh;
    padding: 24px 16px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .board {
    width: 100%;
    max-width: 1100px;
    background: var(--board-panel);
    border: 8px solid var(--board-frame);
    border-radius: 6px;
    box-shadow:
      0 0 0 2px #000,
      0 30px 80px rgba(0,0,0,0.8),
      inset 0 2px 0 rgba(255,255,255,0.05);
    overflow: hidden;
  }

  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px 14px;
    background: linear-gradient(180deg, #000 0%, #0d0d11 100%);
    border-bottom: 3px solid var(--metal);
  }

  .board-header .title-jp {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 6px;
    color: var(--white);
  }
  .board-header .title-en {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 4px;
    color: var(--amber);
    text-shadow: 0 0 12px rgba(245,185,66,0.4);
  }

  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: var(--amber);
    letter-spacing: 2px;
    text-shadow: 0 0 10px rgba(245,185,66,0.5);
  }

  /* Column header */
  .col-head {
    display: grid;
    grid-template-columns: 1.4fr 2.2fr 1.1fr 1.1fr 0.7fr 1.6fr 0.9fr;
    gap: 4px;
    padding: 10px 18px;
    background: #000;
    border-bottom: 2px solid var(--metal);
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--amber-dim);
    text-transform: uppercase;
  }
  .col-head span small { display: block; color: #6a6a70; font-size: 9px; letter-spacing: 1px; }

  .rows { background: var(--board-bg); }

  .row {
    display: grid;
    grid-template-columns: 1.4fr 2.2fr 1.1fr 1.1fr 0.7fr 1.6fr 0.9fr;
    gap: 4px;
    padding: 12px 18px;
    align-items: center;
    border-bottom: 1px solid #000;
    background: var(--row-alt);
    animation: flapIn 0.4s ease both;
  }
  .row:nth-child(even) { background: #101015; }
  .row.done { opacity: 0.35; }

  @keyframes flapIn {
    from { transform: translateY(-6px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* Flap cell look */
  .flap {
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(180deg, #232328 0%, #0e0e12 49%, #0a0a0e 51%, #1a1a1f 100%);
    border: 1px solid var(--flap-edge);
    border-radius: 3px;
    padding: 6px 8px;
    color: var(--amber);
    font-size: 15px;
    letter-spacing: 1px;
    text-shadow: 0 0 6px rgba(245,185,66,0.3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    position: relative;
  }
  .flap::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: rgba(0,0,0,0.6);
  }
  .flap.dest { color: var(--white); font-weight: 700; text-shadow: 0 0 6px rgba(255,255,255,0.25); }
  .flap.cat { font-family:'Oswald'; font-weight:500; letter-spacing:1px; }

  .gate {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
  }
  .gate.p1 { color: #6fa8d8; }
  .gate.p2 { color: var(--amber); }
  .gate.p3 { color: var(--red); text-shadow: 0 0 8px rgba(224,90,82,0.5); }

  .actions-cell { display: flex; gap: 6px; justify-content: flex-end; }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--metal);
    color: #888;
    border-radius: 3px;
    width: 26px; height: 26px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    transition: all 0.15s;
  }
  .icon-btn:hover { border-color: var(--amber); color: var(--amber); }
  .icon-btn.done-btn:hover { border-color: var(--green); color: var(--green); }

  .empty {
    padding: 50px;
    text-align: center;
    color: #55555c;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    font-size: 14px;
  }

  /* Toolbar */
  .toolbar {
    width: 100%;
    max-width: 1100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn-primary {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 3px;
    font-size: 16px;
    background: var(--amber);
    color: #000;
    border: none;
    padding: 14px 28px;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--amber-dim), 0 8px 16px rgba(0,0,0,0.5);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--amber-dim); }

  .toggle-done {
    font-family:'Oswald'; font-size:13px; letter-spacing:1px; color:#888;
    background:transparent; border:1px solid var(--metal); padding:10px 16px;
    border-radius:4px; cursor:pointer;
  }
  .toggle-done.active { color: var(--green); border-color: var(--green); }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(3px);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    z-index: 100;
    overflow-y: auto;
  }
  .overlay.show { display: flex; }

  .modal {
    background: var(--board-panel);
    border: 4px solid var(--metal);
    border-radius: 8px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    animation: flapIn 0.3s ease both;
  }
  .modal-head {
    background: #000;
    padding: 18px 24px;
    border-bottom: 2px solid var(--amber-dim);
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-head h2 {
    font-weight: 500; letter-spacing: 4px; font-size: 20px; color: var(--amber);
  }
  .modal-head .x { background:none;border:none;color:#888;font-size:24px;cursor:pointer; line-height:1; }
  .modal-head .x:hover { color: var(--red); }

  .modal-body { padding: 24px; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 12px; letter-spacing: 2px; color: var(--amber-dim);
    text-transform: uppercase; margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    background: var(--board-bg);
    border: 1px solid var(--metal);
    color: var(--white);
    padding: 10px 12px;
    border-radius: 4px;
    font-size: 14px;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--amber); box-shadow: 0 0 0 2px rgba(245,185,66,0.2);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .cat-wrap { display:flex; gap:8px; }
  .cat-wrap select { flex:1; }
  .cat-wrap button {
    background: var(--metal); color: var(--amber); border:none; border-radius:4px;
    padding:0 14px; cursor:pointer; font-size:18px; font-weight:700;
  }
  .cat-wrap button:hover { background:#444; }

  .prio-group { display:flex; gap:8px; }
  .prio-group label {
    flex:1; text-align:center; padding:10px 4px; border:1px solid var(--metal);
    border-radius:4px; cursor:pointer; font-family:'JetBrains Mono'; font-size:13px;
    color:#888; letter-spacing:0; margin:0;
  }
  .prio-group input { display:none; }
  .prio-group input:checked + label { border-color: var(--amber); color: var(--amber); background: rgba(245,185,66,0.1); }

  .submit-btn {
    width:100%; margin-top:6px;
    font-family:'Oswald'; font-weight:600; letter-spacing:3px; font-size:16px;
    background: var(--amber); color:#000; border:none; padding:14px; border-radius:4px; cursor:pointer;
    box-shadow: 0 4px 0 var(--amber-dim);
  }
  .submit-btn:active { transform: translateY(2px); box-shadow:0 2px 0 var(--amber-dim); }

  @media (max-width: 720px) {
    .col-head, .row { grid-template-columns: 1fr 1.6fr 0.9fr 0.9fr 0.5fr; font-size: 10px; }
    .col-head span:nth-child(6), .col-head span:nth-child(7),
    .row > *:nth-child(6), .row > *:nth-child(7) { display:none; }
    .flap { font-size: 12px; padding: 5px 5px; }
    .board-header .title-jp { display:none; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="board">
    <div class="board-header">
      <span class="title-jp">出発</span>
      <span class="title-en">DEPARTURE</span>
      <span class="clock" id="clock">--:--</span>
    </div>
    <div class="col-head">
      <span>カテゴリ<small>AIRLINE</small></span>
      <span>タスク<small>DESTINATION</small></span>
      <span>開始<small>DEPART</small></span>
      <span>期限<small>ARRIVE</small></span>
      <span>優先<small>GATE</small></span>
      <span>備考<small>REMARKS</small></span>
      <span></span>
    </div>
    <div class="rows" id="rows"></div>
  </div>

  <div class="toolbar">
    <button class="btn-primary" onclick="openModal()">＋ タスク入力</button>
    <button class="toggle-done" id="toggleDone" onclick="toggleShowDone()">完了タスクを表示</button>
  </div>

  <!-- Modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">タスク入力</h2>
        <button class="x" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>カテゴリ / AIRLINE</label>
          <div class="cat-wrap">
            <select id="f-cat"></select>
            <button type="button" onclick="addCategory()" title="カテゴリ追加">＋</button>
          </div>
        </div>
        <div class="field">
          <label>タスク名 / DESTINATION</label>
          <input type="text" id="f-name" placeholder="例：見積書を提出する" maxlength="40">
        </div>
        <div class="row2">
          <div class="field">
            <label>開始 / DEPART</label>
            <input type="datetime-local" id="f-start">
          </div>
          <div class="field">
            <label>期限 / ARRIVE</label>
            <input type="datetime-local" id="f-end">
          </div>
        </div>
        <div class="field">
          <label>優先度 / GATE</label>
          <div class="prio-group">
            <input type="radio" name="prio" id="p1" value="1"><label for="p1">1 低</label>
            <input type="radio" name="prio" id="p2" value="2" checked><label for="p2">2 中</label>
            <input type="radio" name="prio" id="p3" value="3"><label for="p3">3 高</label>
          </div>
        </div>
        <div class="field">
          <label>備考 / REMARKS</label>
          <textarea id="f-note" placeholder="メモ・状況など" maxlength="60"></textarea>
        </div>
        <button class="submit-btn" onclick="saveTask()">登録</button>
      </div>
    </div>
  </div>

<script>
  const STORE_KEY = 'flightBoardTasks_v1';
  const CAT_KEY = 'flightBoardCats_v1';
  let tasks = [];
  let categories = ['仕事','プライベート','買い物','健康','スポッティング'];
  let editId = null;
  let showDone = false;

  // ---- load ----
  function load() {
    try { tasks = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { tasks = []; }
    try {
      const c = JSON.parse(localStorage.getItem(CAT_KEY));
      if (Array.isArray(c) && c.length) categories = c;
    } catch {}
  }
  function persist() {
    localStorage.setItem(STORE_KEY, JSON.stringify(tasks));
    localStorage.setItem(CAT_KEY, JSON.stringify(categories));
  }

  // ---- clock ----
  function tick() {
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  setInterval(tick, 1000); tick();

  // ---- formatting ----
  function fmt(dt) {
    if (!dt) return '--/-- --:--';
    const d = new Date(dt);
    const p = n => String(n).padStart(2,'0');
    return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  // ---- render ----
  function render() {
    const rows = document.getElementById('rows');
    let list = tasks.slice().sort((a,b) => {
      const ta = a.end ? new Date(a.end).getTime() : Infinity;
      const tb = b.end ? new Date(b.end).getTime() : Infinity;
      return ta - tb;
    });
    if (!showDone) list = list.filter(t => !t.done);

    if (!list.length) {
      rows.innerHTML = '<div class="empty">NO FLIGHTS SCHEDULED — タスクがありません</div>';
      return;
    }
    rows.innerHTML = list.map(t => `
      <div class="row ${t.done ? 'done':''}">
        <div class="flap cat">${esc(t.cat)}</div>
        <div class="flap dest">${esc(t.name)}</div>
        <div class="flap">${fmt(t.start)}</div>
        <div class="flap">${fmt(t.end)}</div>
        <div class="gate p${t.prio}">${t.prio}</div>
        <div class="flap">${esc(t.note||'')}</div>
        <div class="actions-cell">
          <button class="icon-btn done-btn" title="完了" onclick="toggleDoneTask('${t.id}')">${t.done?'↺':'✓'}</button>
          <button class="icon-btn" title="編集" onclick="editTask('${t.id}')">✎</button>
          <button class="icon-btn" title="削除" onclick="delTask('${t.id}')">🗑</button>
        </div>
      </div>`).join('');
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---- categories ----
  function fillCatSelect(sel) {
    const el = document.getElementById('f-cat');
    el.innerHTML = categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
    if (sel) el.value = sel;
  }
  function addCategory() {
    const name = prompt('新しいカテゴリ名を入力');
    if (name && name.trim()) {
      const n = name.trim();
      if (!categories.includes(n)) categories.push(n);
      persist();
      fillCatSelect(n);
    }
  }

  // ---- modal ----
  function openModal() {
    editId = null;
    document.getElementById('modalTitle').textContent = 'タスク入力';
    fillCatSelect();
    document.getElementById('f-name').value = '';
    document.getElementById('f-start').value = '';
    document.getElementById('f-end').value = '';
    document.getElementById('f-note').value = '';
    document.getElementById('p2').checked = true;
    document.getElementById('overlay').classList.add('show');
  }
  function closeModal() { document.getElementById('overlay').classList.remove('show'); }

  function saveTask() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { alert('タスク名を入力してください'); return; }
    const data = {
      cat: document.getElementById('f-cat').value,
      name,
      start: document.getElementById('f-start').value,
      end: document.getElementById('f-end').value,
      prio: document.querySelector('input[name=prio]:checked').value,
      note: document.getElementById('f-note').value.trim(),
    };
    if (editId) {
      const t = tasks.find(x=>x.id===editId);
      Object.assign(t, data);
    } else {
      tasks.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,5), done:false, ...data });
    }
    persist(); render(); closeModal();
  }

  function editTask(id) {
    const t = tasks.find(x=>x.id===id); if(!t) return;
    editId = id;
    document.getElementById('modalTitle').textContent = 'タスク編集';
    fillCatSelect(t.cat);
    document.getElementById('f-name').value = t.name;
    document.getElementById('f-start').value = t.start || '';
    document.getElementById('f-end').value = t.end || '';
    document.getElementById('f-note').value = t.note || '';
    document.getElementById('p'+t.prio).checked = true;
    document.getElementById('overlay').classList.add('show');
  }

  function toggleDoneTask(id) {
    const t = tasks.find(x=>x.id===id); if(!t) return;
    t.done = !t.done; persist(); render();
  }
  function delTask(id) {
    if (!confirm('このタスクを削除しますか？')) return;
    tasks = tasks.filter(x=>x.id!==id); persist(); render();
  }
  function toggleShowDone() {
    showDone = !showDone;
    const b = document.getElementById('toggleDone');
    b.classList.toggle('active', showDone);
    b.textContent = showDone ? '完了タスクを隠す' : '完了タスクを表示';
    render();
  }

  document.getElementById('overlay').addEventListener('click', e=>{
    if (e.target.id==='overlay') closeModal();
  });

  load(); render();
</script>
</body>
</html>
